<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10BArchive · Moderation</title>
<style>
:root{color-scheme:dark;--bg:#080d16;--panel:#111b2b;--line:#293b55;--muted:#a5b4ca;--blue:#3b82f6}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#152746 0,#080d16 55%);color:#e8eef8;font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}main{max-width:1050px;margin:0 auto;padding:32px 18px 60px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.brand{font-weight:850;font-size:23px}.brand span{color:#75b5ff}.sub{color:var(--muted);margin:5px 0 24px}.panel,.item{border:1px solid var(--line);background:#101a2beF;border-radius:16px;padding:20px}.panel{margin:18px 0}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}input{min-width:0;flex:1;background:#080f1b;border:1px solid #344760;border-radius:10px;padding:12px;color:white}button{border:1px solid #4c8ff5;background:#2563eb;color:white;border-radius:10px;padding:11px 15px;font-weight:750;cursor:pointer}button.secondary{border-color:#394d67;background:#172438}button.danger{border-color:#91424c;background:#431c25}button:disabled{opacity:.5;cursor:wait}.notice{margin-top:12px;color:#bfd9ff;overflow-wrap:anywhere}.notice.error{color:#ffbfc6}.notice.ok{color:#9af0c0}.list{display:grid;gap:12px;margin-top:18px}.item h3{margin:0 0 8px;overflow-wrap:anywhere}.meta{font-size:13px;color:var(--muted);overflow-wrap:anywhere}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.empty{text-align:center;color:var(--muted);padding:34px 12px;border:1px dashed var(--line);border-radius:12px}.small{font-size:12px;color:var(--muted)}@media(max-width:560px){main{padding:20px 12px}.panel,.item{padding:15px}}
</style></head><body><main>
<div class="top"><div class="brand">10B<span>Archive</span> · Moderator</div><button class="secondary" id="refresh" onclick="loadSubmissions()">Refresh queue</button></div>
<p class="sub">Private review queue. Approving publishes the file to the public archive; rejecting deletes the pending copy.</p>
<section class="panel" id="login-panel"><h2 style="margin-top:0">Moderator sign-in</h2><form id="login-form"><div class="row"><input id="password" type="password" autocomplete="current-password" placeholder="Moderator password" required><button type="submit">Sign in</button></div></form><div class="notice" id="login-message">Your password is sent only to the backend for protected moderator actions.</div></section>
<section id="queue-panel" hidden><div class="top"><h2>Pending submissions</h2><span class="small" id="count"></span></div><div class="list" id="list"><div class="empty">Sign in to load the private queue.</div></div></section>
<script>
let adminPassword='';const $=id=>document.getElementById(id);function message(text,kind=''){const el=$('login-message');el.className='notice '+kind;el.textContent=text;}
$('login-form').addEventListener('submit',async e=>{e.preventDefault();adminPassword=$('password').value;await loadSubmissions();});
async function api(path,method='GET'){const r=await fetch(path,{method,headers:{'x-admin-password':adminPassword}});const data=await r.json().catch(()=>({}));if(!r.ok)throw Error(data.error||'Request failed.');return data;}
async function loadSubmissions(){if(!adminPassword){message('Enter your moderator password first.','error');return;}const btn=$('refresh');btn.disabled=true;try{const data=await api('/api/admin/submissions');$('login-panel').hidden=true;$('queue-panel').hidden=false;message('Signed in.','ok');render(data.submissions||[]);}catch(e){$('queue-panel').hidden=true;$('login-panel').hidden=false;message(e.message,'error');}finally{btn.disabled=false;}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function render(items){$('count').textContent=items.length+' waiting';const list=$('list');if(!items.length){list.innerHTML='<div class="empty">No pending submissions. Nice and tidy!</div>';return;}list.innerHTML=items.map(x=>`<article class="item"><h3>${esc(x.originalName)}</h3><div class="meta">Destination: ${esc(x.destination)}<br>Submitted by: ${esc(x.studentName||'Not provided')}<br>Size: ${Math.max(1,Math.round((x.size||0)/1024))} KB · ${esc(x.submittedAt||'')}</div><div class="actions"><button onclick="act('${esc(x.id)}','approve',this)">Approve & publish</button><button class="danger" onclick="act('${esc(x.id)}','reject',this)">Reject & delete</button></div></article>`).join('');}
async function act(id,action,button){const label=action==='approve'?'approve and publish':'reject and delete';if(!confirm('Are you sure you want to '+label+' this submission?'))return;button.disabled=true;try{const data=await api('/api/admin/submissions/'+encodeURIComponent(id)+'/'+action,'POST');message(action==='approve'?'Approved and published: '+data.publishedPath:'Submission rejected and deleted.','ok');await loadSubmissions();}catch(e){message(e.message,'error');button.disabled=false;}}
</script></main></body></html>
