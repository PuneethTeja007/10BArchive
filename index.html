<style>
:root{color-scheme:dark;--bg:#070b13;--panel:#101827;--panel2:#131f32;--line:#26364e;--text:#edf4ff;--muted:#9aaac2;--blue:#3985ff;--blue2:#2165d9;--cyan:#67c7ff;--danger:#ff7272;--green:#4ade80}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse at top,#12213a 0,#080d18 44%,#070b13 100%);color:var(--text);font:15px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
a{color:inherit;text-decoration:none}button,input,select{font:inherit}button{cursor:pointer}.shell{width:min(1120px,calc(100% - 32px));margin:auto}.topbar{position:sticky;top:0;z-index:10;background:#080d18eF;border-bottom:1px solid #23324a;backdrop-filter:blur(16px)}.nav{height:72px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:11px;font-weight:850;font-size:20px;letter-spacing:-.04em}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,#4598ff,#2458d8);box-shadow:0 8px 24px #2467d555;font-size:15px}.nav-right{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.status{border:1px solid #2c4565;background:#102039;border-radius:999px;padding:6px 10px;color:#a9d4ff}.main{padding:48px 0 76px}.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:26px}.crumbs button{background:none;border:0;color:var(--muted);padding:0}.crumbs button:hover{color:white}.hero{text-align:center;padding:58px 20px 50px}.eyebrow{display:inline-flex;gap:8px;align-items:center;border:1px solid #29456d;background:#102039;color:#9dcaff;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:750;letter-spacing:.08em;text-transform:uppercase}.dot{width:7px;height:7px;border-radius:50%;background:#50a2ff;box-shadow:0 0 12px #50a2ff}.hero h1{font-size:clamp(42px,8vw,78px);line-height:1.02;letter-spacing:-.065em;margin:22px 0 16px}.gradient{background:linear-gradient(90deg,#fff 10%,#8fc5ff 54%,#438bff);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:17px;max-width:600px;margin:0 auto}.contributors{margin:26px auto 0;display:inline-block;color:#79b7ff;letter-spacing:.16em;font-size:12px;font-weight:850;border:1px dashed #345c8c;border-radius:10px;padding:10px 14px}.home-info{max-width:850px;margin:0 auto 20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;text-align:left}.info-panel{border:1px solid var(--line);border-radius:17px;background:linear-gradient(145deg,#111e31,#0c1421);padding:18px;min-width:0}.info-panel h2{margin:0 0 12px;font-size:19px}.info-entry{padding:12px 0;border-top:1px solid #26364e}.info-entry:first-child{border-top:0;padding-top:0}.info-entry strong{display:block}.info-date,.info-sub{font-size:12px;color:var(--muted)}.info-description{color:#d2deef;font-size:13px;margin-top:4px;overflow-wrap:anywhere}.info-empty{color:var(--muted);font-size:13px;padding:8px 0}.info-loading{font-size:12px;color:var(--muted)}.subject-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;max-width:850px;margin:22px auto 0}.subject{min-height:156px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;text-align:left;padding:23px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,#142137,#0d1422);color:var(--text);transition:.2s;position:relative;overflow:hidden}.subject:after{content:"";position:absolute;width:130px;height:130px;border-radius:50%;background:#2e7cff12;right:-35px;bottom:-55px}.subject:not(:disabled):hover{transform:translateY(-4px);border-color:#438cff;box-shadow:0 18px 44px #0005}.subject:disabled{opacity:.48;cursor:not-allowed}.subject-icon{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:#1c3c68;color:#8ec5ff;font-weight:900;font-size:18px}.subject-name{font-weight:800;font-size:20px}.subject-sub{font-size:12px;color:var(--muted)}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin:0 0 22px}.section-head h1{margin:0;font-size:clamp(29px,4vw,43px);letter-spacing:-.045em}.section-head p{margin:6px 0 0;color:var(--muted)}.panel{border:1px solid var(--line);background:#0e1726dd;border-radius:18px;padding:20px}.resource-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.resource{display:flex;gap:15px;align-items:center;text-align:left;width:100%;padding:18px;border:1px solid #263750;border-radius:15px;background:linear-gradient(145deg,#131f31,#0c1421);color:var(--text);transition:.18s}.resource:hover{border-color:#438cff;background:#14243b;transform:translateY(-2px)}.resource-icon{flex:none;width:45px;height:45px;border-radius:13px;display:grid;place-items:center;background:#1a3557;color:#8fc6ff;font-size:20px}.resource-copy{flex:1;min-width:0}.resource-copy strong{display:block;font-size:15px}.resource-copy span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.chev{color:#7daee9;font-size:22px}.folder-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.folder{display:flex;align-items:center;gap:13px;text-align:left;border:1px solid #2a3c55;background:#111d2e;border-radius:14px;padding:16px;color:var(--text);min-height:76px}.folder:hover{border-color:#4d93ff;background:#152743}.folder-symbol{color:#77b7ff;font-size:22px}.folder span:nth-child(2){flex:1;font-weight:700}.tag{font-size:11px;color:#a8bdd7;border:1px solid #31445e;padding:3px 7px;border-radius:999px}.accordion{border:1px solid #2a3b54;border-radius:16px;background:#0e1725;overflow:hidden;margin:13px 0}.acc-head{width:100%;display:flex;align-items:center;gap:13px;text-align:left;background:transparent;color:var(--text);border:0;padding:18px}.acc-icon{width:42px;height:42px;border-radius:12px;background:#1a3557;display:grid;place-items:center;color:#8dc4ff;font-size:19px}.acc-label{flex:1}.acc-label strong{display:block;font-size:15px}.acc-label small{color:var(--muted)}.acc-chevron{font-size:20px;color:#83b8ff;transition:.2s}.accordion.open .acc-chevron{transform:rotate(90deg)}.acc-content{display:none;border-top:1px solid #24354c;padding:16px;background:#0b1320}.accordion.open .acc-content{display:block}.session-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.session{border:1px solid #314766;background:#12233a;border-radius:11px;color:#dceaff;padding:13px;text-align:left;display:flex;align-items:center;gap:10px}.session:hover{border-color:#5195ff;background:#193458}.session .folder-symbol{font-size:17px}.empty{border:1px dashed #30435e;border-radius:13px;padding:28px 18px;text-align:center;color:var(--muted);grid-column:1/-1}.empty .big{font-size:26px;margin-bottom:7px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}.search{width:100%;max-width:440px;background:#0a1220;border:1px solid #2a3b54;border-radius:12px;color:white;padding:12px 14px;outline:none}.search:focus,input:focus,select:focus{border-color:#448cff;box-shadow:0 0 0 3px #448cff22}.btn{border:1px solid #3b82f6;border-radius:11px;background:#2563eb;color:white;padding:11px 15px;font-weight:750}.btn:hover{background:#3478f3}.btn.secondary{border-color:#354963;background:#152236;color:#dceaff}.btn.secondary:hover{border-color:#5799ff}.btn:disabled{opacity:.45;cursor:not-allowed}.form-grid{display:grid;gap:16px}.field label{display:block;font-size:13px;font-weight:750;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid #2c3f59;border-radius:11px;padding:12px;background:#0a1220;color:var(--text)}.hint{font-size:12px;color:var(--muted);margin-top:7px}.file-drop{border:1px dashed #3b5d87;background:#0b1626;border-radius:15px;padding:26px;text-align:center}.file-drop input{max-width:100%}.notice{padding:13px 15px;border:1px solid #355780;background:#10213a;color:#bddcff;border-radius:12px;font-size:13px}.notice.error{border-color:#7f343d;background:#30151d;color:#ffc5cb}.notice.success{border-color:#276849;background:#10281e;color:#a7f3c6}.file-list{display:grid;gap:9px}.file-row{display:flex;gap:12px;align-items:center;border:1px solid #2a3a52;border-radius:12px;padding:12px;background:#101b2b}.file-row .meta{flex:1;min-width:0}.file-row strong{display:block;overflow-wrap:anywhere}.file-row small{color:var(--muted)}.viewer{width:100%;height:min(75vh,780px);border:1px solid #30435c;border-radius:14px;background:#fff}.footer{border-top:1px solid #202f45;padding:24px 0;color:#788ba7;font-size:12px;text-align:center}.muted{color:var(--muted)}.hidden{display:none!important}.upload-progress{margin-top:12px;padding:12px;border:1px solid #2a3d59;border-radius:12px;background:#0b1422}.upload-progress-track{height:10px;background:#26364d;border-radius:999px;overflow:hidden;margin:8px 0}.upload-progress-fill{height:100%;width:0;background:linear-gradient(90deg,#3985ff,#4ade80);transition:width .15s}.upload-progress-meta{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:12px}
@media(max-width:680px){.nav{height:62px}.nav-right .status{display:none}.hero{padding:40px 4px}.subject-grid{grid-template-columns:1fr;max-width:430px}.subject{min-height:115px;flex-direction:row;align-items:center;gap:14px}.subject-icon{flex:none}.subject-copy{flex:1}.resource-grid,.folder-list,.session-grid,.home-info{grid-template-columns:1fr}.section-head{align-items:flex-start;flex-direction:column}.main{padding-top:30px}.panel{padding:14px}.file-row{align-items:flex-start;flex-wrap:wrap}.file-row .btn{margin-left:56px}}
.upload-files-btn {
  background: #1769ff;
  color: white;
  border: none;
  border-radius: 10px;
  padding: 12px 24px;
  cursor: pointer;
  animation: blueFade 3s ease-in-out infinite alternate;
  transition: transform 0.2s ease;
}

.upload-files-btn:hover {
  transform: scale(1.03);
}

@keyframes blueFade {
  from {
    background-color: #1769ff;
  }
  to {
    background-color: #8ecbff;
  }
}

@media (prefers-reduced-motion: reduce) {
  .upload-files-btn {
    animation: none;
    background-color: #1769ff;
  }
}
</style>

<body>
<header class="topbar"><div class="shell nav">
  <a class="brand" href="#/" aria-label="10BArchive home"><span class="brand-mark">10B</span><span>10B<span style="color:#65a9ff">Archive</span></span></a>
  <div class="nav-right"><span class="status">CLASS 10B · RESOURCE HUB</span><a href="#/" aria-label="Home">Home</a></div>
</div></header>
<main class="shell main" id="app" aria-live="polite"></main>
<footer class="footer"><div class="shell">10BArchive · Built for Class 10B · Share knowledge, help everyone learn.<div style="margin-top:8px;color:#9bb4d4">Open-Source Knowledge, Open-Source Learning, Open-Source for everyone.</div></div></footer>
<script>
/*
 * GitHub Pages frontend configuration.
 * Set this to your deployed backend URL, e.g. https://your-api.example.com
 * Keep it empty while browsing the static demo; backend-only actions will explain setup.
 */
const API_BASE = "https://one0barchive-backend.onrender.com";
const app = document.getElementById("app");
const sessionsSample = ["2022-23","2023-24","2024-25","2025-26","2026-27"];
const sessionsBoard = ["2022-23","2023-24","2024-25","2025-26"];
const bookFolders = ["NCERT Books","Owsaal","RSAgarwaal","EduCart Books"];
const examTypes = ["Sample Papers","Board Papers","School Papers"];
const icon = {exam:"▤",books:"▣",answers:"✓",school:"⌂",board:"▥",upload:"↑",folder:"▰",file:"PDF",math:"∑"};
let currentPath = "/";
let selectedCollection = "";
let cachedFiles = [];
let authUser = false;

function cleanPath(){let p=location.hash.replace(/^#/,"")||"/";if(!p.startsWith("/"))p="/"+p;return p.replace(/\/+/g,"/").replace(/\/$/,"")||"/";}
function go(path){location.hash=path==="/"?"#/":"#"+path;}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function slug(s){return s.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");}
function crumbs(path){const parts=path.split("/").filter(Boolean);let out='<div class="crumbs"><button onclick="go(\'/\')">Home</button>';let acc="";for(const p of parts){acc+="/"+p;out+='<span>›</span><button onclick="go(\''+esc(acc)+'\')">'+esc(p.replace(/([a-z])([A-Z])/g,"$1 $2"))+'</button>';}return out+"</div>";}
function pageHead(title,sub){return '<div class="section-head"><div><h1>'+title+'</h1><p>'+sub+'</p></div></div>';}
function resourceCard(title,desc,ico,path){return '<button class="resource" onclick="go(\''+path+'\')"><span class="resource-icon">'+ico+'</span><span class="resource-copy"><strong>'+title+'</strong><span>'+desc+'</span></span><span class="chev">›</span></button>';}
function folderCard(name,path,extra=""){return '<button class="folder" onclick="go(\''+path+'\')"><span class="folder-symbol">▰</span><span>'+esc(name)+'</span>'+(extra?'<span class="tag">'+esc(extra)+'</span>':'')+'</button>';}
function emptyState(message="No files have been added here yet."){return '<div class="empty"><div class="big">▱</div><strong>Nothing here yet</strong><div>'+esc(message)+'</div></div>';}
function home(){return `
<section class="hero"><span class="eyebrow"><span class="dot"></span> The Class 10B Resource Hub</span>
<h1>Everything you need.<br><span class="gradient">All in one archive.</span></h1>
<p>A shared home for exam papers, textbooks, solutions and study resources.</p>
<div class="home-info">
   <section class="info-panel"><h2>📢 Changelog</h2><div id="changelog-list"><div class="info-loading">Loading updates…</div></div></section>
   <section class="info-panel"><h2>🤝 Contributors</h2><div id="contributors-list"><div class="info-loading">Loading contributors…</div></div></section>
 </div>
 <div class="subject-grid">
<button class="subject" onclick="go('/Math')"><span class="subject-icon">∑</span><span class="subject-copy"><span class="subject-name">Math</span><br><span class="subject-sub">Papers, books & solutions</span></span><span class="chev">→</span></button>
<button class="subject" disabled title="Only a Placeholder" aria-label="Science — Only a Placeholder"><span class="subject-icon">⚗</span><span class="subject-copy"><span class="subject-name">Science</span><br><span class="subject-sub">Only a Placeholder</span></span><span class="chev">⌑</span></button>
<button class="subject" disabled title="Only a Placeholder" aria-label="SST — Only a Placeholder"><span class="subject-icon">◎</span><span class="subject-copy"><span class="subject-name">SST</span><br><span class="subject-sub">Only a Placeholder</span></span><span class="chev">⌑</span></button>
</div></section>
<div class="panel" style="max-width:850px;margin:0 auto"><div style="display:flex;align-items:center;gap:14px"><span class="resource-icon">✦</span><div><strong>Made for students, by students.</strong><div class="muted" style="font-size:13px">Have useful study material? Help build the archive for everyone.</div></div></div></div>`;}
function mathPage(){return crumbs("/Math")+pageHead("Math Archive","Choose a collection to explore.")+'<div class="resource-grid">'+
resourceCard("Exam papers and solutions","Sample, board and school papers",icon.exam,"/Math/ExamPapersAndSolutions")+
resourceCard("Books","Textbooks and reference books",icon.books,"/Math/Books")+
resourceCard("Answers/Solutions","Answer keys and worked solutions",icon.answers,"/Math/AnswersSolutions")+
resourceCard("Vydehi School Paper Breakdown","Explore school-paper chapter patterns",icon.school,"/Math/VydehiSchoolPaperBreakdown")+
resourceCard("This year’s Board Chapter Breakdown","Chapter-wise board paper breakdown",icon.board,"/Math/ThisYearsBoardChapterBreakdown")+
'</div><div style="display:flex;justify-content:center;margin-top:28px"><button class="btn upload-files-btn" onclick="go(\'/Math/Upload\')">↑ &nbsp; Upload Files</button></div>';}
function accordion(title,desc,items,key){return '<section class="accordion" id="acc-'+key+'"><button class="acc-head" onclick="toggleAcc(\''+key+'\')"><span class="acc-icon">▰</span><span class="acc-label"><strong>'+title+'</strong><small>'+desc+'</small></span><span class="acc-chevron">›</span></button><div class="acc-content"><div class="session-grid">'+items+'</div></div></section>';}
function toggleAcc(key){const el=document.getElementById("acc-"+key);if(el)el.classList.toggle("open");}
function examPage(){const sample=sessionsSample.map(s=>'<button class="session" onclick="openCollection(\'Sample Papers\',\''+s+'\')"><span class="folder-symbol">▰</span>Session '+s+'<span class="chev">›</span></button>').join("");const board=sessionsBoard.map(s=>'<button class="session" onclick="openCollection(\'Board Papers\',\''+s+'\')"><span class="folder-symbol">▰</span>Session '+s+'<span class="chev">›</span></button>').join("");const school=['Deens Papers','Vydehi Papers'].map(s=>'<button class="session" onclick="openCollection(\'School Papers\',\''+s+'\')"><span class="folder-symbol">▰</span>'+s+'<span class="chev">›</span></button>').join("");
return crumbs("/Math/ExamPapersAndSolutions")+pageHead("Exam papers and solutions","Browse by paper type, session or school.")+accordion("Sample Papers","Sessions 2022–23 to 2026–27",sample,"sample")+accordion("Board Papers","Sessions 2022–23 to 2025–26",board,"board")+accordion("School Papers","Deens and Vydehi collections",school,"school")+
'<div id="collection-results" class="panel hidden" style="margin-top:20px"></div>';}
function openCollection(type,session){selectedCollection=type+" / "+session;const p=document.getElementById("collection-results");p.classList.remove("hidden");const dest="Math/ExamPapersAndSolutions/"+type+"/"+(type==="School Papers"?session:"Session "+session);p.dataset.destination=dest;p.innerHTML='<div class="section-head"><div><h1 style="font-size:24px">'+esc(session)+'</h1><p>'+esc(type)+' · Files in this collection</p></div></div><div class="toolbar"><input class="search" id="collection-search" placeholder="Search files…" oninput="filterCollectionFiles()"><button class="btn secondary" onclick="loadCollectionFiles()">Refresh</button></div><div id="collection-file-list" class="file-list">'+emptyState()+'</div>';loadCollectionFiles();p.scrollIntoView({behavior:"smooth",block:"start"});}
async function loadCollectionFiles(){const p=document.getElementById("collection-results");const list=document.getElementById("collection-file-list");if(!p||!list)return;const dest=p.dataset.destination;if(!API_BASE){list.innerHTML=emptyState("Connect the backend to list uploaded files.");return;}list.innerHTML='<div class="muted">Loading files…</div>';try{const r=await fetch(apiUrl("/api/files?path="+encodeURIComponent(dest)));const data=await r.json();if(!r.ok)throw Error(data.error||"Could not load files");p._files=data.files||[];showCollectionFiles(p._files);}catch(e){list.innerHTML='<div class="notice error">Could not load files. Check the backend connection.</div>';}}
function showCollectionFiles(files){const list=document.getElementById("collection-file-list");if(!list)return;if(!files.length){list.innerHTML=emptyState();return;}list.innerHTML=files.map(f=>'<div class="file-row"><span class="resource-icon">PDF</span><div class="meta"><strong>'+esc(f.name)+'</strong><small>'+esc(f.destination)+' · '+(f.size?Math.max(1,Math.round(f.size/1024))+" KB":"")+'</small></div><button class="btn secondary" onclick="previewFile(\''+esc(f.id)+'\',\''+esc(f.name)+'\')">Preview</button><a class="btn" href="'+apiUrl("/api/files/"+encodeURIComponent(f.id)+"/download")+'" target="_blank" rel="noopener">Download</a></div>').join("");}
function filterCollectionFiles(){const q=(document.getElementById("collection-search")?.value||"").toLowerCase();const p=document.getElementById("collection-results");showCollectionFiles((p?._files||[]).filter(f=>f.name.toLowerCase().includes(q)));}
function booksPage(){return crumbs("/Math/Books")+pageHead("Books","Choose a book collection.")+'<div class="folder-list">'+bookFolders.map(n=>folderCard(n,"/Math/Books/"+slug(n))).join("")+'</div>';}
function collectionPage(path){const parts=path.split("/").filter(Boolean);const title=parts[parts.length-1].replace(/([a-z])([A-Z])/g,"$1 $2").replace(/-/g," ");return crumbs(path)+pageHead(esc(title),"Files and resources in this collection.")+'<div class="panel" id="files-panel"><div class="toolbar"><input class="search" id="file-search" placeholder="Search files in this collection…" oninput="filterFiles()"><button class="btn secondary" onclick="refreshFiles()">Refresh</button></div><div id="file-list" class="file-list">'+emptyState()+'</div></div>';}
function uploadPage(){return crumbs("/Math/Upload")+pageHead("Submit a Resource","Share study material with Class 10B. Your file stays private until the archive owner approves it.")+
'<div class="panel"><div class="notice" style="margin-bottom:18px">Every submission is reviewed before it becomes public. Please upload only material you have permission to share.</div><div id="upload-message"></div><form class="form-grid" id="upload-form" onsubmit="submitUpload(event)">'+
'<div class="field"><label for="student-name">Your name <span aria-hidden="true">*</span></label><input id="student-name" name="studentName" maxlength="80" placeholder="Enter your name" required autocomplete="name"></div>'+
'<div class="field"><label for="destination">Where should this file go?</label><select id="destination" required><option value="">Choose a destination…</option>'+
'<optgroup label="Exam papers and solutions"><option>Math/ExamPapersAndSolutions/Sample Papers/Session 2022-23</option><option>Math/ExamPapersAndSolutions/Sample Papers/Session 2023-24</option><option>Math/ExamPapersAndSolutions/Sample Papers/Session 2024-25</option><option>Math/ExamPapersAndSolutions/Sample Papers/Session 2025-26</option><option>Math/ExamPapersAndSolutions/Sample Papers/Session 2026-27</option><option>Math/ExamPapersAndSolutions/Board Papers/Session 2022-23</option><option>Math/ExamPapersAndSolutions/Board Papers/Session 2023-24</option><option>Math/ExamPapersAndSolutions/Board Papers/Session 2024-25</option><option>Math/ExamPapersAndSolutions/Board Papers/Session 2025-26</option><option>Math/ExamPapersAndSolutions/School Papers/Deens Papers</option><option>Math/ExamPapersAndSolutions/School Papers/Vydehi Papers</option></optgroup>'+
'<optgroup label="Books"><option>Math/Books/NCERT Books</option><option>Math/Books/Owsaal</option><option>Math/Books/RSAgarwaal</option><option>Math/Books/EduCart Books</option></optgroup>'+
'<optgroup label="Other Math resources"><option>Math/AnswersSolutions</option><option>Math/VydehiSchoolPaperBreakdown</option><option>Math/ThisYearsBoardChapterBreakdown</option></optgroup></select></div>'+
'<div class="field"><label for="upload-file">Select files</label><div class="file-drop"><div style="font-size:28px;margin-bottom:8px">↑</div><strong>Choose multiple files from your device</strong><p class="muted" style="margin:5px 0 14px;font-size:12px">PDF, DOC/DOCX, PPT/PPTX, XLS/XLSX, JPG or PNG · Up to 20 files · Max 25 MB each · 90 MB total per batch</p><input id="upload-file" type="file" multiple required accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,.jpg,.jpeg,.png" onchange="showSelectedFiles()"><div class="hint" id="selected-files">No files selected.</div></div></div>'+
'<button class="btn" id="upload-submit" type="submit">Submit for approval</button><div class="hint">Submitting does not publish the file. The archive owner reviews it first.</div></form></div>'; }

function specialPage(path){let title,desc;if(path.includes("AnswersSolutions")){title="Answers / Solutions";desc="Answer keys and worked solutions will be organized here.";}else if(path.includes("VydehiSchoolPaperBreakdown")){title="Vydehi School Paper Breakdown";desc="Chapter-wise breakdowns of Vydehi school papers will appear here.";}else{title="This Year's Board Chapter Breakdown";desc="Chapter-wise board paper trends and breakdowns will appear here.";}return crumbs(path)+pageHead(title,desc)+'<div class="panel">'+emptyState("This section is ready for the resources you provide.")+'</div>';}
function renderSiteContent(data){
 const changelog=document.getElementById('changelog-list'), contributors=document.getElementById('contributors-list');
 if(!changelog||!contributors)return;
 const updates=Array.isArray(data.changelog)?data.changelog:[];
 const people=Array.isArray(data.contributors)?data.contributors:[];
 changelog.innerHTML=updates.length?updates.map(x=>'<article class="info-entry"><div class="info-date">'+esc(x.date||'')+'</div><strong>'+esc(x.title||'Update')+'</strong>'+(x.description?'<div class="info-description">'+esc(x.description)+'</div>':'')+'</article>').join(''):'<div class="info-empty">No updates posted yet.</div>';
 contributors.innerHTML=people.length?people.map(x=>'<article class="info-entry"><strong>'+esc(x.name||'Contributor')+'</strong>'+(x.role?'<div class="info-sub">'+esc(x.role)+'</div>':'')+(x.description?'<div class="info-description">'+esc(x.description)+'</div>':'')+'</article>').join(''):'<div class="info-empty">Contributors will be listed here as they join.</div>';
}
async function loadSiteContent(){
 const changelog=document.getElementById('changelog-list');
 if(!changelog||!API_BASE)return;
 try{const r=await fetch(apiUrl('/api/site-content'),{cache:'no-store'});if(!r.ok)throw Error('Could not load homepage details');renderSiteContent(await r.json());}
 catch(e){const c=document.getElementById('changelog-list'),p=document.getElementById('contributors-list');if(c)c.innerHTML='<div class="info-empty">Updates could not be loaded.</div>';if(p)p.innerHTML='<div class="info-empty">Contributor details could not be loaded.</div>';}
}
function render(){currentPath=cleanPath();if(currentPath==="/"){app.innerHTML=home();loadSiteContent();}else if(currentPath==="/Math")app.innerHTML=mathPage();else if(currentPath==="/Math/ExamPapersAndSolutions")app.innerHTML=examPage();else if(currentPath==="/Math/Books")app.innerHTML=booksPage();else if(currentPath==="/Math/Upload")app.innerHTML=uploadPage();else if(currentPath.startsWith("/Math/Books/")||currentPath.startsWith("/Math/AnswersSolutions")||currentPath.startsWith("/Math/VydehiSchoolPaperBreakdown")||currentPath.startsWith("/Math/ThisYearsBoardChapterBreakdown"))app.innerHTML=collectionPage(currentPath);else if(currentPath==="/Math/ExamPapersAndSolutions/Collection")app.innerHTML=collectionPage(currentPath);else app.innerHTML=crumbs(currentPath)+pageHead("Page not found","This location does not exist in the archive yet.")+'<button class="btn" onclick="go(\'/\')">Back home</button>';if(currentPath.startsWith("/Math/Books/")||currentPath.includes("AnswersSolutions")||currentPath.includes("VydehiSchoolPaperBreakdown")||currentPath.includes("ThisYearsBoardChapterBreakdown"))refreshFiles();if(currentPath==="/Math/Upload")checkBackend();}
function apiUrl(path){return API_BASE.replace(/\/$/,"")+path;}
async function checkBackend(){const msg=document.getElementById("upload-message");if(!msg)return;if(!API_BASE){msg.innerHTML='<div class="notice" style="margin-bottom:16px">The submission service will be enabled after the Render backend is deployed and its URL is added to this file.</div>';return;}try{const r=await fetch(apiUrl("/api/health"));if(!r.ok)throw Error();msg.innerHTML='<div class="notice success" style="margin-bottom:16px">Submission service is online. Files are reviewed before publication.</div>';}catch(e){msg.innerHTML='<div class="notice error" style="margin-bottom:16px">Cannot reach the submission service. Check its URL and deployment status.</div>';}}
function showSelectedFiles(){
 const input=document.getElementById('upload-file'),out=document.getElementById('selected-files');
 if(!input||!out)return;
 const files=Array.from(input.files||[]);
 out.textContent=files.length?`${files.length} file(s) selected: ${files.map(f=>f.name).join(', ')}`:'No files selected.';
}
async function submitUpload(e){
 e.preventDefault();
 const msg=document.getElementById('upload-message'),btn=document.getElementById('upload-submit'),files=Array.from(document.getElementById('upload-file').files||[]),dest=document.getElementById('destination').value,name=document.getElementById('student-name').value.trim();
 if(!API_BASE){msg.innerHTML='<div class="notice error">Submissions are not enabled yet. The backend must be deployed first.</div>';return;}
 if(!name){msg.innerHTML='<div class="notice error">Please enter your name.</div>';document.getElementById('student-name').focus();return;}
 if(!files.length){msg.innerHTML='<div class="notice error">Choose at least one file.</div>';return;}
 if(files.length>20){msg.innerHTML='<div class="notice error">Please select no more than 20 files at once.</div>';return;}
 const tooLarge=files.find(f=>f.size>25*1024*1024);
 if(tooLarge){msg.innerHTML='<div class="notice error">“'+esc(tooLarge.name)+'” is larger than 25 MB.</div>';return;}
 const total=files.reduce((sum,f)=>sum+f.size,0);
 if(total>90*1024*1024){msg.innerHTML='<div class="notice error">All selected files together must be 90 MB or smaller. Please split them into smaller batches.</div>';return;}
 const form=new FormData();files.forEach(file=>form.append('files',file));form.append('destination',dest);form.append('studentName',name);
 btn.disabled=true;btn.textContent='Submitting '+files.length+' file(s)…';msg.innerHTML='<div class="notice">Uploading your files to the private review queue. Please keep this page open.<div class="upload-progress"><div class="upload-progress-meta"><span id="upload-progress-label">Starting upload…</span><strong id="upload-progress-percent">0%</strong></div><div class="upload-progress-track"><div id="upload-progress-fill" class="upload-progress-fill"></div></div><div class="upload-progress-meta"><span id="upload-progress-detail">0 MB sent</span><span>'+files.length+' file(s)</span></div></div></div>';
 try{
  const data=await new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST',apiUrl('/api/submissions'));xhr.upload.addEventListener('progress',event=>{if(!event.lengthComputable)return;const pct=Math.min(100,Math.round(event.loaded/event.total*100));const fill=document.getElementById('upload-progress-fill'),percent=document.getElementById('upload-progress-percent'),label=document.getElementById('upload-progress-label'),detail=document.getElementById('upload-progress-detail');if(fill)fill.style.width=pct+'%';if(percent)percent.textContent=pct+'%';if(label)label.textContent=pct===100?'Upload sent; waiting for server…':'Uploading files…';if(detail)detail.textContent=(event.loaded/1024/1024).toFixed(1)+' / '+(event.total/1024/1024).toFixed(1)+' MB sent';});xhr.addEventListener('load',()=>{let parsed={};try{parsed=JSON.parse(xhr.responseText||'{}')}catch(_){}if(xhr.status>=200&&xhr.status<300)resolve(parsed);else if(parsed.results)resolve(parsed);else reject(Error(parsed.error||'Submission failed.'));});xhr.addEventListener('error',()=>reject(Error('Network error while uploading. Please try again.')));xhr.addEventListener('abort',()=>reject(Error('Upload was cancelled.')));xhr.send(form);});
  const succeeded=Number(data.submitted||0),failed=Number(data.failed||0);
  const details=(data.results||[]).filter(x=>!x.ok).map(x=>'<li>'+esc(x.file)+': '+esc(x.error)+'</li>').join('');
  msg.innerHTML='<div class="notice '+(failed?'error':'success')+'"><strong>'+esc(data.message||'Upload finished.')+'</strong>'+(failed?'<p>Files that failed:</p><ul>'+details+'</ul>':'<p>All submitted files are private and will not appear publicly unless approved.</p>')+'</div>';
  if(succeeded===files.length)document.getElementById('upload-form').reset();
  showSelectedFiles();
 }catch(err){msg.innerHTML='<div class="notice error">'+esc(err.message||'Submission failed.')+'</div>';}
 finally{btn.disabled=false;btn.textContent='Submit files for approval';}
}

function destinationForPath(path){
  if(path.startsWith("/Math/Books/")){const slugName=path.split("/").pop();const map={"ncert-books":"NCERT Books","owsaal":"Owsaal","rsagarwaal":"RSAgarwaal","educart-books":"EduCart Books"};return "Math/Books/"+(map[slugName]||slugName);}
  if(path.includes("AnswersSolutions"))return "Math/AnswersSolutions";
  if(path.includes("VydehiSchoolPaperBreakdown"))return "Math/VydehiSchoolPaperBreakdown";
  if(path.includes("ThisYearsBoardChapterBreakdown"))return "Math/ThisYearsBoardChapterBreakdown";
  return path.replace(/^\/Math\/?/,"");
}
async function refreshFiles(){const list=document.getElementById("file-list");if(!list)return;const path=destinationForPath(currentPath);if(!API_BASE){list.innerHTML=emptyState("Connect the backend to list uploaded files.");return;}list.innerHTML='<div class="muted">Loading files…</div>';try{const r=await fetch(apiUrl("/api/files?path="+encodeURIComponent(path)));const data=await r.json();if(!r.ok)throw Error(data.error||"Could not load files");cachedFiles=data.files||[];showFiles(cachedFiles);}catch(e){list.innerHTML='<div class="notice error">Could not load files. Check the backend connection.</div>';}}
function showFiles(files){const list=document.getElementById("file-list");if(!list)return;if(!files.length){list.innerHTML=emptyState();return;}list.innerHTML=files.map(f=>'<div class="file-row"><span class="resource-icon">PDF</span><div class="meta"><strong>'+esc(f.name)+'</strong><small>'+esc(f.destination||"Math")+" · "+(f.size?Math.max(1,Math.round(f.size/1024))+" KB":"")+'</small></div><button class="btn secondary" onclick="previewFile(\''+esc(f.id)+'\',\''+esc(f.name)+'\')">Preview</button><a class="btn" href="'+apiUrl("/api/files/"+encodeURIComponent(f.id)+"/download")+'" target="_blank" rel="noopener">Download</a></div>').join("");}
function filterFiles(){const q=(document.getElementById("file-search")?.value||"").toLowerCase();showFiles(cachedFiles.filter(f=>f.name.toLowerCase().includes(q)));}
function previewFile(id,name){const old=document.getElementById("pdf-viewer-wrap");if(old)old.remove();const wrap=document.createElement("div");wrap.id="pdf-viewer-wrap";wrap.className="panel";wrap.style.marginTop="18px";wrap.innerHTML='<div class="section-head"><div><h1 style="font-size:23px">'+esc(name)+'</h1><p>Document preview</p></div><button class="btn secondary" onclick="document.getElementById(\'pdf-viewer-wrap\').remove()">Close</button></div><iframe class="viewer" title="PDF preview" src="'+apiUrl("/api/files/"+encodeURIComponent(id)+"/preview")+'"></iframe><p class="hint">If this file type cannot be previewed in your browser, use Download.</p>';document.querySelector(".panel").appendChild(wrap);wrap.scrollIntoView({behavior:"smooth",block:"start"});}
window.addEventListener("hashchange",render);render();
</script>
</body></html>
